name: Release token probe (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    steps:
      - name: Probe GITHUB_TOKEN release creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release create v0.0.3-envprobe --draft --target main --title probe --notes probe 2>&1 | tee probe.log; then
            echo "CREATE OK — environment: release fixes the 403"
            gh release delete v0.0.3-envprobe --yes || true
          else
            echo "CREATE STILL 403 — needs a PAT"
            exit 1
          fi
