# Cross-platform computer-use compile gate.
# Six cells are cross-compiled on one macOS runner, so a foreign SDK is not
# available on every runner. This gate builds and tests the real host target on
# each of the three desktop OSes, then type-checks all three backend cfg
# configurations. A green gate is evidence of shape, never of a desktop journey.
name: Cross-platform CU compile gate

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/cu-cfg-check.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/cu-platforms.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minicon-harness-cu-platforms
  cancel-in-progress: false

jobs:
  backend:
    name: ${{ matrix.family }} backend
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: linux, runner: ubuntu-24.04}
          - {family: macos, runner: macos-15}
          - {family: windows, runner: windows-2025}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test the compiled backend on this OS
        shell: bash
        run: cargo test --locked -- --nocapture platform_capability_matrix_is_disclosed_and_admits_by_name

      - name: Full host test suite
        shell: bash
        run: cargo test --locked

      - name: Link the release cell on this OS
        shell: bash
        run: cargo build --locked --release

      - name: Type-check all three backend configurations
        shell: bash
        run: python3 scripts/cu-cfg-check.py
