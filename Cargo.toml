[package]
name = "minicon-harness"
version = "0.0.1"
edition = "2021"
description = "Minimal bounded agent harness in Rust: exactly two tools, file and exec."
license = "MIT OR Apache-2.0"

[dependencies]
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
