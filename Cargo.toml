[package]
name = "minicon-harness"
version = "0.0.21"
edition = "2021"
description = "Minimal bounded agent harness in Rust: file, exec and screen, plus the minicon-gate sidecar."
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "minicon-harness"
path = "src/main.rs"

[[bin]]
name = "minicon-harness-mcp"
path = "src/bin/minicon-harness-mcp.rs"

[[bin]]
name = "minicon-gate"
path = "src/bin/minicon-gate.rs"

[dependencies]
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
